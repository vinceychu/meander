name: Release

# builds the Linux AppImage/deb and the Intel macOS app, uploads them into
# one draft release, then publishes it. Installed apps check this
# repo's latest release and update themselves.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    name: Typecheck + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - run: npm run typecheck
      - run: npm run lint

  draft:
    name: Create the draft
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes "Meander ${GITHUB_REF_NAME#v}"

  package:
    name: Package (${{ matrix.platform }})
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux --x64
          # Intel Mac. Ad-hoc signed (no Apple Developer ID): the app's own
          # mac-self-update.cjs installs updates, since Squirrel.Mac can't.
          - os: macos-15-intel
            platform: mac-x64
            builder_args: --mac --x64 -c.mac.notarize=false -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.icon=build/icon.icns
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs
      - name: Build and upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder_args }} --publish always

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          for need in latest-linux.yml latest-mac.yml; do
            echo "$assets" | grep -qx "$need" || { echo "::error::missing $need"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
